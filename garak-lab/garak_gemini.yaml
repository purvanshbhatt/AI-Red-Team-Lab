---
# garak_gemini.yaml - Garak configuration for scanning Gemini via OpenAI-compatible API
#
# Usage (run_garak.ps1 sets these automatically):
#   $env:GEMINI_API_KEY = "your-key-here"
#   $env:OPENAICOMPATIBLE_API_KEY = $env:GEMINI_API_KEY
#   garak --config garak_gemini.yaml --probes promptinject
#
# This config uses Gemini's OpenAI-compatible REST endpoint so that garak's
# built-in OpenAICompatible generator can connect natively — no custom code needed.

plugins:
  target_type: openai.OpenAICompatible
  target_name: gemini-2.0-flash
  generators:
    openai:
      OpenAICompatible:
        uri: https://generativelanguage.googleapis.com/v1beta/openai/
        temperature: 0.7
        stop: []            # Gemini doesn't use garak's default stop tokens ('#', ';')
        suppressed_params:
          - seed            # Gemini doesn't support the 'seed' parameter
